<!doctype html><html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#f4f6f9; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  #root { padding: 0; }
  family-board-card {
    --ha-card-background: #fff; --card-background-color: #fff;
    --primary-text-color:#212121; --secondary-text-color:#727272;
    --divider-color:#e0e0e0; --secondary-background-color:#f5f5f5;
    --primary-color:#03a9f4; --error-color:#db4437; --warning-color:#ffa600;
    --ha-card-border-radius:12px; --ha-card-box-shadow:0 2px 8px rgba(0,0,0,.09);
    display:block;
  }

  body.dark { background:#111111; }
  body.dark family-board-card {
    --ha-card-background:#1c1c1c; --card-background-color:#1c1c1c;
    --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12); --secondary-background-color:#202020;
    --primary-color:#03a9f4; --error-color:#db4437; --warning-color:#ffa600;
    --text-primary-color:#212121; --state-icon-color:#a1a1a1;
    --ha-card-box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  ha-card, family-board-card::part(card) { }
</style></head><body>
<div id="root"></div>
<script type="module">
import "../../dist/ha-family-board-card.js";
// Stand-in for HA's <ha-icon>: the real Material Design Icons (as in HA), at
// the size HA gives them, so layout checks and README screenshots see what
// users see. An unknown name falls back to a grey dot.
import * as MDI from "../../node_modules/@mdi/js/mdi.js";
const mdiPath = (name) =>
  MDI["mdi" + String(name || "").replace(/^mdi:/, "").replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase())];
customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  set icon(v) { this._icon = v; this._draw(); }
  get icon() { return this._icon ?? this.getAttribute("icon"); }
  attributeChangedCallback() { this._draw(); }
  connectedCallback() {
    Object.assign(this.style, { display: "inline-flex", flex: "none", verticalAlign: "middle",
      width: "var(--mdc-icon-size, 24px)", height: "var(--mdc-icon-size, 24px)" });
    this._draw();
  }
  _draw() {
    const d = mdiPath(this.icon);
    this.innerHTML = d
      ? `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`
      : `<span style="display:block;width:100%;height:100%;border-radius:50%;background:currentColor;opacity:.35"></span>`;
  }
});
const Q = new URLSearchParams(location.search);
if (Q.has("dark")) document.body.classList.add("dark");
const lang = Q.get("lang") || "de";
const T = lang === "de"
  ? { home:"Homeoffice", office:"Büro", school:"Schule", breakt:"Pause", sport:"Sport",
      swim:"Schwimmen", lunch:"Mittagessen", nap:"Mittagsschlaf", free:"Freispiel",
      bfast:"offenes Frühstück", music:"Musikschule", doc:"Kinderarzt", pickup:"Abholen", ride:"Ben: Mia abholen",
      care:"Betreuung", pool:"Hallenbad", bday:"Geburtstag Oma", title:"Familienplan",
      bin:"Gelbe Tonne", hol:"Herbstferien", parents:"Elternabend" }
  : { home:"Home office", office:"Office", school:"School", breakt:"Break", sport:"Sport",
      swim:"Swimming", lunch:"Lunch", nap:"Nap", free:"Free play",
      bfast:"Open breakfast", music:"Music school", doc:"Pediatrician", pickup:"Pick-up", ride:"Ben: pick up Mia",
      care:"After-school care", pool:"Swimming pool", bday:"Grandma's birthday", title:"Family board",
      bin:"Recycling bin", hol:"Autumn break", parents:"Parents' evening" };

const base = new Date(); base.setHours(0,0,0,0);
const day = i => new Date(base.getFullYear(), base.getMonth(), base.getDate() - ((base.getDay()+6)%7) + i);
const at = (i,h,m) => { const d=day(i); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).toISOString(); };
let n = 0;
const E=(i,s,h1,m1,h2,m2,location)=>({uid:"u"+(n++),summary:s,location,start:{dateTime:at(i,h1,m1)},end:{dateTime:at(i,h2,m2)}});
const todayIdx = (new Date().getDay()+6)%7;
const t = todayIdx;

const cal = {
  "calendar.anna":[ E(t,T.home,8,0,16,0), E(t,T.pickup,16,30,17,0),
                    E(t+1,T.office,9,0,17,0), E(t-1,T.office,9,0,17,0) ],
  "calendar.ben":[  E(t,T.office,9,0,17,30), E(t+1,T.home,8,0,16,0), E(t-1,T.office,9,0,17,0) ],
  "calendar.mia":[  E(t,T.school,8,0,8,45), E(t,T.school,8,45,9,30), E(t,T.breakt,9,30,9,50),
                    E(t,T.sport,9,50,10,35), E(t,T.swim,10,45,11,30,T.pool), E(t,T.lunch,12,0,12,45),
                    E(t,T.music,15,0,16,0), E(t,T.ride,16,0,16,30), E(t+1,T.school,8,0,13,0), E(t-1,T.school,8,0,13,0) ],
  "calendar.leon":[ E(t,T.bfast,7,0,9,0), E(t,T.free,9,0,11,30), E(t,T.lunch,11,30,12,15),
                    E(t,T.nap,12,15,14,0), E(t,T.care,14,0,16,0),
                    E(t+1,T.care,8,0,16,0), E(t-1,T.care,8,0,16,0) ],
};
const D = (i) => { const d = day(i); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const A = (i,j,s) => ({uid:"a"+(n++),summary:s,start:{date:D(i)},end:{date:D(j)}});
cal["calendar.muell"] = [A(t,t+1,T.bin), A(t+7,t+8,T.bin)];
cal["calendar.ferien"] = [A(t+1,t+6,T.hol)];
cal["calendar.familie"] = [E(t,T.parents,19,0,20,30), A(t+9,t+10,T.bday)];
const person = (n,s)=>({state:s,attributes:{friendly_name:n}});
const hass = {
  locale:{language:lang,time_format:lang==="de"?"24":"12"},
  states:{
    "person.anna":person("Anna","home"), "person.ben":person("Ben","not_home"),
    "person.mia":person("Mia","home"),   "person.leon":person("Leon","home"),
    "calendar.anna":{state:"on",attributes:{friendly_name:"Anna",supported_features:Q.has("writable")?7:0}},
    "calendar.ben":{state:"on",attributes:{friendly_name:"Ben",supported_features:0}},
    "calendar.mia":{state:"on",attributes:{friendly_name:"Mia",supported_features:0}},
    "calendar.leon":{state:"on",attributes:{friendly_name:"Leon",supported_features:0}},
    "weather.home":{state:"rainy",attributes:{friendly_name:"Home"}},
    "calendar.muell":{state:"off",attributes:{friendly_name:"Abfall",supported_features:0}},
    "calendar.ferien":{state:"off",attributes:{friendly_name:"Schulferien",supported_features:0}},
    "calendar.familie":{state:"off",attributes:{friendly_name:"Familie",supported_features:0}},
  },
  callApi: async(_m,path)=>cal[path.split("?")[0].replace("calendars/","")]||[],
  callWS: async(msg)=>{
    if (msg.type === "media_source/browse_media")
      return { children: ["sea","hills","dusk"].map(n=>({media_class:"image",media_content_id:`${msg.media_content_id}/${n}.jpg`})) };
    if (msg.type === "media_source/resolve_media") return { url: PHOTO(msg.media_content_id) };
    if (msg.service !== "get_forecasts") return {};
    const conds = ["rainy","sunny","partlycloudy","cloudy","lightning-rainy","snowy","sunny"];
    const forecast = Array.from({length:10},(_,i)=>({
      datetime: new Date(base.getFullYear(),base.getMonth(),base.getDate()+i,12).toISOString(),
      condition: conds[i%conds.length], temperature: 24-i, templow: 13-i }));
    return { response: { "weather.home": { forecast } } };
  },
};
// drawn stand-ins for family photos: sky, sun and hills
const PHOTO = (id) => {
  const k = ["sea","hills","dusk"].findIndex(n=>id.includes(n));
  const [a,b,c] = [["#7dd3fc","#fde68a","#0ea5e9"],["#bae6fd","#fef3c7","#16a34a"],["#fb923c","#fde047","#7c3aed"]][Math.max(k,0)];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1200" height="800" fill="url(#g)"/><circle cx="900" cy="230" r="90" fill="#fff7" /><path d="M0 560 Q300 420 600 540 T1200 500 V800 H0Z" fill="${c}"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
};
const el=document.createElement("family-board-card");
el.setConfig({
  type:"custom:family-board-card",
  title: T.title,
  view: Q.get("view") || "day",
  views:["now","day","timeline","week","month","agenda"],
  weather_entity: Q.has("noweather") ? undefined : "weather.home",
  family_calendars: Q.has("nofamily") ? undefined : ["calendar.muell","calendar.ferien","calendar.familie"],
  calendars: { "calendar.muell": { icon: "mdi:trash-can", color: "#EAB308" },
               "calendar.ferien": { icon: "mdi:beach", color: "#22C55E" } },
  swipe: Q.has("swipe"),
  screensaver_media: Q.has("saver") ? "media-source://media_source/local/fotos" : undefined,
  screensaver_after: 1,
  night_start: Q.has("night") ? "21:00" : undefined,
  night_end: Q.has("night") ? "06:30" : undefined,
  countdowns: lang === "de" ? ["ferien", "geburtstag"] : ["break", "birthday"],
  show_focus: !Q.has("slim"), auto_icons:true, slim_header: Q.has("slim"), show_alerts: Q.has("alerts"), late_warning: Q.has("late") ? 30 : undefined, gap_min:60,
  background_hours: 3, start_hour:7, end_hour:18, trim_hours:false,
  hour_height: 64, hour_width: 110, time_grid:15,
  persons:[
    {name:"Anna",person:"person.anna",calendar:"calendar.anna",driver:Q.has("rides")},
    {name:"Ben",person:"person.ben",calendar:"calendar.ben",driver:Q.has("rides")},
    {name:"Mia",person:"person.mia",calendar:"calendar.mia"},
    {name:"Leon",person:"person.leon",calendar:"calendar.leon"},
  ],
});
el.hass=hass;
document.getElementById("root").appendChild(el);
</script></body></html>
