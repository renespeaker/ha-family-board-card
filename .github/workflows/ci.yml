name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Meldet nur; blockiert bewusst nicht, damit eine beabsichtigte Aenderung
      # an einer gespiegelten Datei nicht das jeweils andere Repo lahmlegt.
      - name: Gespiegelte Dateien abgleichen
        run: npm run check:shared
